services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            string $firewallName: '%user.firewall_name%'

    UserBundle\:
        resource: '../../*'
        exclude: '../../{Entity,Repository,Tests,Resources}'

    UserBundle\Controller\RegistrationController:
        arguments:
            $confirmationEnabled: '%user.registration.confirmation.enabled%'

    UserBundle\Controller\ResettingController:
        arguments:
            $retryTtl: '%user.resetting.retry_ttl%'
            $tokenTtl: '%user.resetting.token_ttl%'

    UserBundle\Security\LoginManager:
        arguments:
            $userChecker: '@UserBundle\Security\UserChecker'

    user.util.donor_manipulator:
        alias: UserBundle\Lib\DonorManipulator
        public: true

    UserBundle\Lib\Quotas\Quotas:
        lazy: true
        arguments:
            $options: '%mco.mediaconch.quotas%'

    UserBundle\Validator\UserInitializer:
        tags: ['validator.initializer']

    # The remember me cookie of the main firewall is also given to the guest users
    Symfony\Component\Security\Http\RememberMe\RememberMeHandlerInterface: '@security.authenticator.remember_me_handler.main'
