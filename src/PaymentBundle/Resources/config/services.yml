services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            # The payments are simulated: the payment providers are not called
            $paymentSimulation: '%payment_simulation%'

    _instanceof:
        PaymentBundle\Method\PaymentMethodInterface:
            tags: [ payment.method ]

    PaymentBundle\:
        resource: '../../*'
        exclude: '../../{Entity,Event,Repository,Tests,Resources}'

    PaymentBundle\Method\PaypalExpressCheckoutMethod:
        arguments:
            $httpClient: '@PaymentBundle\Payum\HttpClient'
            $username: '%paypal_username%'
            $password: '%paypal_password%'
            $signature: '%paypal_signature%'
            $sandbox: '%paypal_sandbox%'

    PaymentBundle\Lib\DetailsCipher:
        arguments: [ '%payment_secret%' ]

    PaymentBundle\EventListener\OrdersListener:
        tags:
            - { name: kernel.event_listener, event: PaymentBundle\Event\PaymentCapturedEvent, method: onPaymentCaptured }
