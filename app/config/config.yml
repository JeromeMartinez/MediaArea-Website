# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#configuration
parameters:
    locale: en
    app.locales: be|bg|ca|de|en|es|fa|fr|hr|hu|it|ja|ka|ko|lt|nl|pl|pt|pt-BR|ru|sq|sv|th|uk|zh-CN|zh-HK|zh-TW

    # User accounts
    user.firewall_name: main
    user.from_email.address: info@mediaarea.net
    user.from_email.sender_name: MediaArea
    user.registration.confirmation.enabled: false
    # Delay before a new password reset email can be requested, in seconds
    user.resetting.retry_ttl: 7200
    # Lifetime of the link of the password reset email, in seconds
    user.resetting.token_ttl: 86400

    # Payments: the sandbox of Paypal is used in the development environment
    payment.paypal.sandbox: false

framework:
    #esi: ~
    translator:
        fallbacks: ['%locale%']
        default_path: '%kernel.project_dir%/app/Resources/translations'
    secret: '%secret%'
    router:
        resource: '%kernel.project_dir%/app/config/routing.yml'
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    # The options which have not the same default value in all the supported versions of Symfony (6.4 to 8)
    # are set with the value of the current version: validation, cookie of the session, handle_all_throwables
    validation:
        enable_attributes: true
        email_validation_mode: html5
    default_locale: '%locale%'
    trusted_hosts: ~
    session:
        # https://symfony.com/doc/current/reference/configuration/framework.html#handler-id
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_secure: auto
        cookie_samesite: lax
    fragments: ~
    http_method_override: true
    handle_all_throwables: true
    assets: ~
    asset_mapper:
        # The assets are the Resources/public directories of the bundles
        paths: []
    php_errors:
        # Notices and warnings of PHP are logged as warnings, the current versions of Symfony log them
        # as errors by default: they would be written by the "fingers_crossed" log handler of production
        log:
            !php/const E_DEPRECATED: info
            !php/const E_USER_DEPRECATED: info
            !php/const E_NOTICE: warning
            !php/const E_USER_NOTICE: warning
            !php/const E_WARNING: warning
            !php/const E_USER_WARNING: warning
            !php/const E_COMPILE_WARNING: warning
            !php/const E_CORE_WARNING: warning
            !php/const E_USER_ERROR: critical
            !php/const E_RECOVERABLE_ERROR: critical
            !php/const E_COMPILE_ERROR: critical
            !php/const E_PARSE: critical
            !php/const E_ERROR: critical
            !php/const E_CORE_ERROR: critical
    web_link:
        enabled: true
    mailer:
        # Built from the mailer_* parameters, see AppKernel
        dsn: '%mailer_dsn%'

# Twig Configuration
twig:
    default_path: '%kernel.project_dir%/app/Resources/views'
    debug: '%kernel.debug%'
    strict_variables: '%kernel.debug%'
    form_themes:
        - 'bootstrap_3_horizontal_layout.html.twig'
        - '@App/Form/recaptcha_widget.html.twig'

# Twig components, used by EasyAdmin
twig_component:
    anonymous_template_directory: 'components/'
    defaults: {}

# Doctrine Configuration
doctrine:
    dbal:
        driver: pdo_mysql
        host: '%database_host%'
        port: '%database_port%'
        dbname: '%database_name%'
        user: '%database_user%'
        password: '%database_password%'
        charset: utf8mb4
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
        types:
            # Type of the existing database which is not part of Doctrine DBAL any more
            array: AppBundle\Doctrine\Type\ArrayType
        # The tables of JMSPaymentCoreBundle are kept as archives of the payments made before the "order_payment"
        # table, they have no entity any more
        schema_filter: '~^(?!(payment_instructions|payments|financial_transactions|credits)$)~'

    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true

# Doctrine migrations
doctrine_migrations:
    migrations_paths:
        'Application\Migrations': '%kernel.project_dir%/app/DoctrineMigrations'
    storage:
        table_storage:
            table_name: migration_versions
    enable_profiler: false

# Stof doctrine extensions
stof_doctrine_extensions:
    orm:
        default:
            sluggable: true
            timestampable: true

