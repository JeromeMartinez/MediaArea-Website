# To get started with security, check out the documentation:
# https://symfony.com/doc/current/security.html
security:
    # https://symfony.com/doc/current/security/passwords.html
    password_hashers:
        UserBundle\Entity\User: auto

    role_hierarchy:
        ROLE_BOT:         ROLE_USER
        ROLE_GUEST:       ROLE_USER
        ROLE_BASIC:       ROLE_USER
        ROLE_BETA:        ROLE_BASIC
        ROLE_ADMIN:       ROLE_BETA
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    # https://symfony.com/doc/current/security/user_providers.html
    providers:
        user_bundle:
            id: UserBundle\Security\UserProvider
        api_key_user_provider:
            id: UserBundle\Security\ApiKeyUserProvider

    firewalls:
        # disables authentication for assets and the profiler, adapt it according to your needs
        dev:
            pattern: ^/(_(profiler|wdt)|assets|bundles)/
            security: false

        # Firewall for MCO public API
        public_api:
            pattern: ^/MediaConchOnline/api/public/
            stateless: true
            security: false

        # Firewall for MCO protected API
        protected_api:
            pattern: ^/MediaConchOnline/api/protected/
            stateless: true
            provider: api_key_user_provider
            custom_authenticators:
                - UserBundle\Security\ApiKeyAuthenticator

        main:
            pattern: ^/
            lazy: true
            provider: user_bundle
            user_checker: UserBundle\Security\UserChecker
            form_login:
                login_path: fos_user_security_login
                check_path: fos_user_security_check
                enable_csrf: true
                always_use_default_target_path: false
                default_target_path: homepage
                use_referer: true
            logout:
                path: fos_user_security_logout
            remember_me:
                secret: '%secret%'
                lifetime: 31536000 # 365 days in seconds
                # The cookie is set at each login, whatever the "remember me" checkbox
                always_remember_me: true

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/resetting, roles: PUBLIC_ACCESS }
        - { path: ^/settings, roles: IS_AUTHENTICATED_REMEMBERED }
        - { path: ^/admin(/|$), roles: ROLE_ADMIN }
